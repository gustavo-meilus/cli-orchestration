name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities here; follow SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest repository, commands, route, and inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TacticSwitch version or commit
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host CLI
      options: [Codex CLI, Claude Code, GitHub Copilot CLI, Not host-specific]
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: Host CLI and OS version
  - type: textarea
    id: evidence
    attributes:
      label: Logs and validation
      description: Remove secrets and personal data. Include worker-creation evidence when relevant.
